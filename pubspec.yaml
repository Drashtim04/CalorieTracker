name: calorie_tracker
description: A calorie tracker app built with Clean Architecture, Riverpod, and Hive.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.2.1

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  path_provider: ^2.1.3
  collection: ^1.18.0
  image_picker: ^1.2.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
  # Fonts loaded via google_fonts package at runtime
